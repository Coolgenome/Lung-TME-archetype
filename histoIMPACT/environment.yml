# histoIMPACT conda environment (scientific stack).
# PyTorch and timm are installed by setup_env.sh with pip, so the CUDA build
# matches the machine (GPU / CPU / Apple silicon).
#   bash setup_env.sh            (recommended)
#   conda env create -f environment.yml && pip install torch timm   (manual)
name: histoimpact
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy>=1.24
  - scipy>=1.11
  - pandas>=1.5
  - pillow>=9.5
  - matplotlib>=3.7
  - scikit-image>=0.21
  - scikit-learn>=1.3
  - pip
